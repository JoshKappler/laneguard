<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0b0c0e; color: #e6eaef;
    font-family: "IBM Plex Sans", sans-serif; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(#22262c 1px, transparent 1px), linear-gradient(90deg, #22262c 1px, transparent 1px);
    background-size: 48px 48px; opacity: 0.25; }
  .glow { position: absolute; width: 700px; height: 700px; right: -160px; top: -220px;
    background: radial-gradient(circle, rgba(61,220,255,0.14), transparent 62%); }
  .wrap { position: relative; padding: 64px 80px 60px; height: 100%; display: flex; flex-direction: column; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 19px; letter-spacing: 0.28em;
    text-transform: uppercase; color: #626d7a; margin-bottom: 24px; }
  h1 { font-size: 96px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  h1 .g { color: #3ddcff; }
  /* wide enough to break where the sentence breaks, not mid-clause */
  p { font-size: 36px; line-height: 1.32; color: #9aa4b0; max-width: 660px; margin-top: 28px; }
  .foot { font-family: "IBM Plex Mono", monospace; font-size: 17px; color: #626d7a;
    margin-top: auto; margin-bottom: 18px; }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .chip { border: 1px solid #22262c; border-radius: 6px; padding: 14px 20px; background: #121417;
    font-family: "IBM Plex Mono", monospace; white-space: nowrap; }
  .chip .lab { font-size: 14px; color: #626d7a; letter-spacing: 0.1em; text-transform: uppercase; }
  .chip .val { font-size: 27px; font-variant-numeric: tabular-nums; margin-top: 7px; letter-spacing: -0.01em; }
  .human { color: #35c46b; } .bad { color: #f0555e; } .acc { color: #3ddcff; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow">Behavioral anti-cheat · test bench</div>
    <h1>LANE<span class="g">GUARD</span></h1>
    <p>The client-side detector loses. The economics don&rsquo;t.</p>
    <div class="foot">an original simulation built from public screenshots &middot; no access to any real app</div>
    <div class="row">
      <div class="chip"><div class="lab">stealth bot &middot; 10 min &times; 12 seeds</div><div class="val human">reads HUMAN 12/12</div></div>
      <div class="chip"><div class="lab">break-even bot</div><div class="val bad">3.3&sigma; outlier</div></div>
      <div class="chip"><div class="lab">signals</div><div class="val acc">7 &middot; ROC-ready</div></div>
    </div>
  </div>
</body>
</html>
